name: SuperCR Device Keeper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  keep-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          date

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install matching Chrome + ChromeDriver (Chrome for Testing)
        run: |
          set -euo pipefail

          JSON=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json)

          VERSION=$(echo "$JSON" | jq -r '.channels.Stable.version')
          CHROME_URL=$(echo "$JSON" | jq -r '.channels.Stable.downloads.chrome[] | select(.platform=="linux64") | .url')
          DRIVER_URL=$(echo "$JSON" | jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url')

          if [ -z "$CHROME_URL" ] || [ "$CHROME_URL" = "null" ] || [ -z "$DRIVER_URL" ] || [ "$DRIVER_URL" = "null" ]; then
            echo "Could not resolve download URLs from the Chrome for Testing API" >&2
            exit 1
          fi

          echo "Resolved Chrome for Testing version: $VERSION"

          INSTALL_DIR="$HOME/cft"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          cd "$INSTALL_DIR"

          curl -fsSL "$CHROME_URL" -o chrome-linux64.zip
          curl -fsSL "$DRIVER_URL" -o chromedriver-linux64.zip

          unzip -q chrome-linux64.zip
          unzip -q chromedriver-linux64.zip

          chmod +x chrome-linux64/chrome
          chmod +x chromedriver-linux64/chromedriver

          "$INSTALL_DIR/chrome-linux64/chrome" --version
          "$INSTALL_DIR/chromedriver-linux64/chromedriver" --version

          {
            echo "CHROME_VERSION=$VERSION"
            echo "CHROME_BIN=$INSTALL_DIR/chrome-linux64/chrome"
            echo "CHROMEDRIVER_BIN=$INSTALL_DIR/chromedriver-linux64/chromedriver"
          } >> "$GITHUB_ENV"

      - name: Clear undetected-chromedriver cache
        run: |
          rm -rf "$HOME/.local/share/undetected_chromedriver"
          rm -rf "$HOME/.cache/undetected_chromedriver"
          rm -rf /tmp/undetected_chromedriver*

      - name: Install dependencies
        run: |
          pip install --upgrade --no-cache-dir undetected-chromedriver setuptools

      - name: Run SuperCR Device Keeper
        continue-on-error: true
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PIN: ${{ secrets.PIN }}
          LOCATIONS: ${{ secrets.LOCATIONS }}
          KEEP_DEVICE_NAMES: ${{ secrets.KEEP_DEVICE_NAMES }}
          KEEP_MODE: ${{ secrets.KEEP_MODE }}
          MODE: ${{ secrets.MODE }}
          PREFERRED_PROFILE: ${{ secrets.PREFERRED_PROFILE }}
          TZ: Asia/Kolkata
        run: python supercrheadless.py

      - name: 🔄 Auto-Restart Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔁 Triggering next workflow run to restart the script..."
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "✅ Restart triggered successfully!"

name: SuperCR Device Keeper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  keep-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          date

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome (pinned version 126)
        run: |
          # Install a specific Chrome version that works with undetected-chromedriver
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable=126.0.6478.126-1
          # Pin Chrome to prevent automatic updates
          sudo apt-mark hold google-chrome-stable
          google-chrome --version

      - name: Install dependencies
        run: |
          pip install --upgrade --no-cache-dir undetected-chromedriver setuptools

      - name: Run SuperCR Device Keeper
        continue-on-error: true
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PIN: ${{ secrets.PIN }}
          LOCATIONS: ${{ secrets.LOCATIONS }}
          KEEP_DEVICE_NAMES: ${{ secrets.KEEP_DEVICE_NAMES }}
          KEEP_MODE: ${{ secrets.KEEP_MODE }}
          MODE: ${{ secrets.MODE }}
          PREFERRED_PROFILE: ${{ secrets.PREFERRED_PROFILE }}
          TZ: Asia/Kolkata
        run: python supercrheadless.py

      - name: 🔄 Auto-Restart Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔁 Triggering next workflow run to restart the script..."
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "✅ Restart triggered successfully!"
